# Effort for each open card on the team board (Board in
# _data/communication_system_infograph.yml), for the priority × effort matrix
# above the kanban board
# (_includes/ocs_priority_matrix.html). The board has a Priority field but no
# effort field, so effort lives here.
#
#   id        the card's item id on the board (the itemId in its board link)
#   title     for people reading this file; cards are matched by id
#   effort    S, M or L (see Efforts below)
#   priority  only used while the card has no Priority on the board: a
#             suggestion, shown with a dashed outline until someone sets it there
#
# A card that isn't listed here (a new one) shows under "Not sorted yet" below
# the matrix until it gets an effort.

Efforts:
  S: "A day or less"
  M: "A few days"
  L: "A week or more"

